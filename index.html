<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT Bet Tracker</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen pb-12">

    <!-- Header / Bankroll Display -->
    <header class="bg-gray-800 p-5 shadow-lg sticky top-0 z-50 border-b border-gray-700">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-xs uppercase tracking-wider text-gray-400 font-bold">Total Bankroll</h1>
                <p class="text-3xl font-black text-emerald-400" id="bankroll-display">$1,000.00</p>
            </div>
            <button onclick="refreshData()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition px-4 py-2 rounded-xl text-sm font-bold shadow-md">
                🔄 Pull Scraped Odds
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 mt-6">
        
        <!-- Live +EV Edge Bets Feed -->
        <section>
            <h2 class="text-lg font-bold mb-3 flex items-center text-amber-400">🔥 Top +EV Value Bets</h2>
            <div id="bets-container" class="space-y-3">
                <p class="text-gray-400 text-center py-6 text-sm">Tap "Pull Scraped Odds" to view scanned opportunities.</p>
            </div>
        </section>

        <!-- Profit / Loss Ledger -->
        <section class="mt-8 bg-gray-800 border border-gray-700 rounded-3xl p-5 shadow-xl">
            <h2 class="text-lg font-bold mb-3 text-blue-400">📊 Your Performance Ledger</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="pb-2">Wager Target</th>
                            <th class="pb-2 text-center">Stake</th>
                            <th class="pb-2 text-right">Result</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body" class="divide-y divide-gray-700/50">
                        <!-- Bets track here via browser cache -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- QR Modal Display (Hidden by default) -->
        <div id="qr-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-800 border border-gray-700 w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl">
                <h3 id="qr-title" class="font-bold text-lg mb-1">Bet Selected</h3>
                <p id="qr-details" class="text-sm text-gray-400 mb-4">$0.00 stake @ +000</p>
                
                <div class="bg-white p-4 rounded-2xl inline-block mb-4 shadow-inner">
                    <div id="qrcode"></div>
                </div>

                <div class="space-y-2">
                    <button onclick="confirmBet()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold text-sm shadow-md">
                        ✅ I Placed This Bet (Track It)
                    </button>
                    <button onclick="closeModal()" class="w-full bg-gray-700 py-2 rounded-xl text-gray-300 font-medium text-sm">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let bankroll = parseFloat(localStorage.getItem('bankroll')) || 1000.00;
        let betHistory = JSON.parse(localStorage.getItem('betHistory')) || [];
        let activeBet = null;

        function updateBankrollUI() {
            document.getElementById('bankroll-display').innerText = `$${bankroll.toFixed(2)}`;
            localStorage.setItem('bankroll', bankroll);
        }

        async function refreshData() {
            const button = document.querySelector('button[onclick="refreshData()"]');
            button.innerText = "⏳ Requesting Scan...";
            button.disabled = true;

            try {
                const dataResponse = await fetch('live_odds.json?nocache=' + new Date().getTime());
                if (!dataResponse.ok) throw new Error("No data payload detected.");
                
                const bets = await dataResponse.json();
                renderBetsUI(bets);
                button.innerText = "🔄 Pull Scraped Odds";
                button.disabled = false;

            } catch (err) {
                alert("Notice: Data file initializing. It will appear once your cloud Actions scraper finishes running.");
                button.innerText = "🔄 Pull Scraped Odds";
                button.disabled = false;
            }
        }

        function renderBetsUI(bets) {
            const container = document.getElementById('bets-container');
            container.innerHTML = "";
            
            if(!bets || bets.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center py-6 text-sm">No +EV edges found right now.</p>`;
                return;
            }

            bets.forEach(bet => {
                let softOdds = bet.soft_odds;
                let decimalMultiplier = softOdds > 0 ? (softOdds / 100) + 1 : (100 / Math.abs(softOdds)) + 1;
                let bValue = decimalMultiplier - 1;
                let evDec = bet.ev / 100;
                let impliedP = (evDec + 1) / (bValue + 1);
                let fullKelly = ((bValue * impliedP) - (1 - impliedP)) / bValue;
                let safeStake = Math.max(0, bankroll * (fullKelly * 0.25)); // Quarter-Kelly

                const card = document.createElement('div');
                card.className = "bg-gray-800 border border-emerald-500/20 rounded-2xl p-4 shadow-md";
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded-md">+${bet.ev}% EV</span>
                            <h3 class="font-bold text-lg mt-1">${bet.team}</h3>
                            <p class="text-xs text-gray-400">vs ${bet.opponent} • MT Line: ${softOdds > 0 ? '+'+softOdds : softOdds}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-gray-400 block">Suggested Stake</span>
                            <span class="text-xl font-extrabold text-white">$${safeStake.toFixed(2)}</span>
                        </div>
                    </div>
                    <button onclick="selectBet('${bet.team}', ${softOdds}, ${safeStake})" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition shadow-md">
                        ⚡ Lock & Generate QR Code
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function renderLedgerUI() {
            const tbody = document.getElementById('ledger-body');
            tbody.innerHTML = "";
            
            if (betHistory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-gray-500 text-center py-4 text-xs">No recorded wagers yet.</td></tr>`;
                return;
            }

            betHistory.forEach((bet, index) => {
                const tr = document.createElement('tr');
                tr.className = "text-xs";
                tr.innerHTML = `
                    <td class="py-3 font-medium">
                        <div>${bet.team}</div>
                        <div class="text-[10px] text-gray-400">${bet.date} @ ${bet.odds > 0 ? '+'+bet.odds : bet.odds}</div>
                    </td>
                    <td class="py-3 text-center font-bold text-gray-300">$${bet.stake.toFixed(2)}</td>
                    <td class="py-3 text-right">
                        ${bet.status === 'pending' ? `
                            <div class="flex justify-end gap-1">
                                <button onclick="resolveBet(${index}, 'win')" class="bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded">W</button>
                                <button onclick="resolveBet(${index}, 'loss')" class="bg-rose-500/20 text-rose-400 font-bold px-2 py-0.5 rounded">L</button>
                            </div>
                        ` : bet.status === 'win' ? `
                            <span class="text-emerald-400 font-extrabold">+$${bet.payout.toFixed(2)}</span>
                        ` : `
                            <span class="text-rose-400 font-medium">-$${bet.stake.toFixed(2)}</span>
                        `}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function selectBet(team, odds, stake) {
            activeBet = { team, odds, stake };
            document.getElementById('qr-title').innerText = team;
            document.getElementById('qr-details').innerText = `$${stake.toFixed(2)} Stake @ ${odds > 0 ? '+' + odds : odds}`;
            document.getElementById('qrcode').innerHTML = "";
            
            // Temporary QR format string
            let kioskString = `SPORTSBET_MT_BET_SLIP:${team}|ODDS:${odds}|STAKE:${stake.toFixed(2)}`;
            
            new QRCode(document.getElementById("qrcode"), {
                text: kioskString,
                width: 180,
                height: 180,
                colorDark : "#000000",
